<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Feelings</title>
</head>

<body>
    <header>
        <h1>How does this painting make you feel?</h1>
        <p>Describe how this artwork makes you feel and submit your answer.</p>
    </header>

    <div class="content-div">

        <div class="image-div">
            <img src="Image.jpg" alt="Francis Bacon painting 1946">
            <p>Francis Bacon - painting 1946</p>
        </div>

        <div class="answer-div">
            <input id="number-coffee" type="text" size="50" required />
            <button id="button-coffee">Log my answer</button>
        </div>

        <div class="total-tracker">
            <button id="get-tracker">See all the answers</button>
            <div id="coffee-info"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
